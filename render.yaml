services:
  - type: web
    name: arena-alpha-portal
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /opt/render/project/src/storage/arena_alpha.db
    disk:
      name: arena-alpha-dados
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
