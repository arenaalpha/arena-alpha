{% extends "base.html" %}{% block title %}Aulas | Arena Alpha{% endblock %}{% block content %}
<section class="cabecalho"><p class="selo">AULAS EXPERIMENTAIS</p><h1>Venha treinar com a gente.</h1><p>Preencha seus dados. Confirmaremos a disponibilidade pelo WhatsApp.</p></section>
<form class="formulario" method="post"><label>Nome completo<input name="nome" required maxlength="120" autocomplete="name"></label><label>WhatsApp com DDD<input name="telefone" required maxlength="20" inputmode="tel" placeholder="(11) 99999-9999" autocomplete="tel"></label><label>Modalidade<select name="esporte" required><option value="">Selecione</option><option>Futvolei</option><option>Volei de areia</option></select></label><label>Data desejada<input name="data" type="date" required min="{{ hoje }}"></label><label>Horário desejado <small>(opcional)</small><input name="horario" type="time"></label><div class="armadilha"><label>Não preencha<input name="website" tabindex="-1" autocomplete="off"></label></div><button class="botao" type="submit">Solicitar aula experimental</button></form><p class="nota">Aulas experimentais de vôlei de areia acontecem às segundas-feiras.</p>{% endblock %}
