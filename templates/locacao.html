{% extends "base.html" %}{% block title %}Locação | Arena Alpha{% endblock %}{% block content %}
<section class="cabecalho"><p class="selo">LOCAÇÃO DA QUADRA</p><h1>Reserve seu horário.</h1><p>A quadra funciona das 9h às 22h. A solicitação só é confirmada após contato da Arena.</p></section>
<form class="formulario" method="post"><label>Nome completo<input name="nome" required maxlength="120" autocomplete="name"></label><label>WhatsApp com DDD<input name="telefone" required maxlength="20" inputmode="tel" placeholder="(11) 99999-9999" autocomplete="tel"></label><label>Data da locação<input name="data" type="date" required min="{{ hoje }}"></label><label>Tipo de locação<select name="tipo" id="tipo" required><option value="">Selecione</option><option value="Quadra - R$ 40,00/hora">Quadra — R$ 40,00 por hora</option><option value="Evento - R$ 300,00 (09h as 22h)">Evento — R$ 300,00 (9h às 22h)</option></select></label><div id="campos-horario"><label>Horário de início<input name="horario" type="time" min="09:00" max="21:00"></label><label>Duração em horas<input name="duracao" type="number" min="1" max="13" step="1" placeholder="Ex.: 2"></label></div><div class="armadilha"><label>Não preencha<input name="website" tabindex="-1" autocomplete="off"></label></div><button class="botao" type="submit">Solicitar locação</button></form>
<script>const tipo=document.querySelector('#tipo'),campos=document.querySelector('#campos-horario');tipo.addEventListener('change',()=>campos.hidden=tipo.value.includes('Evento'));</script>{% endblock %}
