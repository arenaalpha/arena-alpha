{% extends "base.html" %}
{% block title %}Inscrição | Arena Alpha{% endblock %}
{% block content %}
<section class="hero"><p class="selo">ARENA ALPHA</p><h1>Faça sua inscrição</h1><p>Preencha sua ficha. A matrícula será criada somente após a confirmação da Arena pelo WhatsApp.</p></section>
<form class="formulario" method="post"><label>Nome completo<input name="nome" required autocomplete="name"></label><label>Data de nascimento<input name="data_nascimento" type="date" required></label><label>CPF<input name="cpf" required inputmode="numeric" maxlength="14" placeholder="000.000.000-00"></label><label>WhatsApp com DDD<input name="whatsapp" required inputmode="tel" maxlength="20" autocomplete="tel" placeholder="55 (DD) 99999-9999"></label><label>Endereço completo<input name="endereco" required autocomplete="street-address"></label><label>Esporte<select name="esporte" required><option value="">Selecione</option><option value="Volei de areia">Vôlei de areia</option><option value="Futvolei">Futvôlei</option></select></label><label>Frequência<select name="frequencia" required><option value="">Selecione</option><option value="1x por semana - R$ 65,00">Vôlei 1x por semana — R$ 65,00</option><option value="2x por semana - R$ 120,00">Vôlei 2x por semana — R$ 120,00</option><option value="Diaria - R$ 25,00 por dia">Vôlei diária — R$ 25,00</option><option value="1x por semana - R$ 60,00">Futvôlei 1x por semana — R$ 60,00</option><option value="2x por semana - R$ 85,00">Futvôlei 2x por semana — R$ 85,00</option><option value="Diaria - R$ 20,00 por dia">Futvôlei diária — R$ 20,00</option></select></label><label>Turma e horário disponíveis<select name="turma_id" required><option value="">Selecione uma turma</option>{% for turma in turmas %}<option value="{{ turma.id }}">{{ turma.modalidade }} · {{ turma.nome }} — {{ turma.proxima_data }} às {{ turma.horario }}</option>{% endfor %}</select></label><label>Como conheceu a Arena?<select name="como_conheceu" required><option value="">Selecione</option><option>Instagram</option><option>Indicação</option><option>Passou pelo local</option><option>Era aluno(a) de outro CT</option></select></label><label>Restrições alimentares<input name="restricoes_alimentares" required placeholder="Nenhuma, se não houver"></label><label>Problema de saúde<input name="problema_saude" required placeholder="Não, se não houver"></label><label>Necessidades especiais<input name="necessidades_especiais" required placeholder="Não, se não houver"></label><label>É menor de idade?<select name="menor_idade" required><option value="">Selecione</option><option>Não</option><option>Sim</option></select></label><label>Nome do responsável<input name="responsavel_nome"></label><label>CPF do responsável<input name="responsavel_cpf" inputmode="numeric"></label><label>Parentesco do responsável<input name="responsavel_parentesco"></label><label>Autoriza uso de imagem e voz?<select name="autorizacao_imagem" required><option value="">Selecione</option><option>Sim, autorizo</option><option>Não autorizo</option></select></label><div class="armadilha"><label>Não preencha<input name="website" tabindex="-1" autocomplete="off"></label></div><button class="botao botao-grande" type="submit">📝 Enviar inscrição</button></form>
{% endblock %}
